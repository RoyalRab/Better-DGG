name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Keep in step with the base image in the Dockerfile.
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  # The browser suites (dev/*.mjs) against the fake feed, in Playwright's Chromium.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install -g playwright && npx playwright install --with-deps chromium
      - run: sudo apt-get install -y ffmpeg && sh dev/make-stream.sh
      - name: Run the suites
        run: |
          node dev/fake-live.js &
          for suite in smoke step twitch-autoplay chat-login features layouts videos kick-player; do
            LIVE_URL=ws://localhost:9996 PORT=8769 node server.js &
            SERVER=$!
            sleep 2
            node dev/$suite.mjs
            kill $SERVER
            sleep 1
          done
