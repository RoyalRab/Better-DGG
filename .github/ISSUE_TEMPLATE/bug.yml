name: Problem
description: Something in DGG Remix isn't working
title: 'Problem: '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead? A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Where
      description: Filled in by the app when you come from its settings; edit anything you'd rather not share.
      placeholder: Version, browser, installed app or browser tab, screen size
