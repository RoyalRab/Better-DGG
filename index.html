<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11151d">
  <title>Better DGG</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header id="bar">
    <button id="source-btn" class="source" type="button" aria-label="Change stream">
      <span id="source-label">Pick a stream</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <span class="spacer"></span>
    <button id="sound-btn" class="icon on" type="button" title="Turn sound on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    </button>
    <button id="awake-btn" class="icon" type="button" title="Keep screen on" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5 1 3h-2zm0 20-1-3h2zM2 12l3-1v2zm20 0-3 1v-2zM4.9 4.9l2.8 1.4-1.4 1.4zm14.2 14.2-2.8-1.4 1.4-1.4zM4.9 19.1l1.4-2.8 1.4 1.4zM19.1 4.9l-1.4 2.8-1.4-1.4z"/></svg>
    </button>
    <button id="chat-btn" class="icon" type="button" title="Show or hide chat" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>
    </button>
    <button id="menu-btn" class="icon" type="button" title="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </button>
  </header>

  <main id="stage">
    <section id="player" aria-label="Stream"></section>
    <section id="chat" aria-label="Chat">
      <iframe id="chat-frame" title="destiny.gg chat" src="https://www.destiny.gg/embed/chat" allow="clipboard-write"></iframe>
    </section>
  </main>

  <dialog id="sheet">
    <form method="dialog" id="source-form">
      <h2>Stream</h2>
      <label for="source-input">Paste a Kick, YouTube, Twitch or Rumble link, or a DGG embed like <code>#kick/destiny</code></label>
      <div class="row">
        <input id="source-input" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="kick.com/destiny">
        <button type="submit" value="go" class="primary">Watch</button>
      </div>
      <p id="source-error" class="error" hidden></p>
      <div id="recent" class="chips"></div>

      <h2>Settings</h2>
      <label class="toggle"><input type="checkbox" id="opt-awake"> Keep screen on while the app is open</label>
      <label class="toggle"><input type="checkbox" id="opt-resume"> Keep audio going when the screen locks (YouTube and Twitch)</label>

      <div class="links">
        <button type="button" id="reload-chat">Reload chat</button>
        <a href="https://www.destiny.gg/login" target="_blank" rel="noopener">Log in to destiny.gg</a>
        <button type="button" id="install-btn" hidden>Install app</button>
      </div>
      <div class="row end"><button type="submit" value="close">Close</button></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
